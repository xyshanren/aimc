[project]
name = "aimc"
version = "1.0.0"
description = "AI Model Compass - 面向个人开发者的轻量级 LLM 网关与优惠情报聚合工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MulanPSL-2.0" }
authors = [{ name = "aimc" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "playwright>=1.45.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 网络依赖的 e2e 集成测试 (需本地 uvicorn + 真实上游, 默认 skip)",
]
